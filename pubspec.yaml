name: saferuas
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  lottie: ^3.7.0
  flutter_animate: ^4.5.2
  google_fonts: ^6.3.2
  awesome_snackbar_content: ^0.1.5
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  http: ^1.5.0
  flutter_tts: ^4.2.5
  skeletonizer: ^3.0.0
  tflite_flutter: ^0.12.1
  camera: ^0.12.2
  image: ^4.0.21
  photo_view: ^0.15.0
  flutter_image_compress: ^2.3.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/lotties/
    - assets/images/
    - assets/model/

# KONFIGURASI IKON APLIKASI DI HP
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"